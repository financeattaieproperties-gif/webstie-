appId: af.attaieproperties.admin
productName: Attaie Admin
copyright: Copyright © 2025 Attaie Properties

directories:
  buildResources: resources
  output: release

files:
  - out/**/*
  - package.json

extraResources:
  - from: resources/
    to: resources/
    filter:
      - "**/*"

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Attaie Admin
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico

mac:
  icon: resources/icon.icns
  category: public.app-category.business
  target:
    - target: dmg
      arch: [x64, arm64]

linux:
  icon: resources/icon.png
  category: Office
  target:
    - target: AppImage
      arch: [x64]
